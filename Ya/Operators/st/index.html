</text> <line x1="10" y1="10" x2="50" y2="10" style="stroke:#C1C8DA; stroke-width:1"></line> <line x1="10" y1="10" x2="10" y2="25" style="stroke:#C1C8DA; stroke-width:1"></line> </svg> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="expr" href="../../../Ya/Operators/st">`st`</a> <tspan class="text">:</tspan> <a class="expr">target</a> <tspan class="expr">i</tspan> <tspan class="text">(</tspan> <a class="type" href="../../../Ya/Glossary/Subtyping">Supertype</a> <tspan class="expr">i</tspan> <tspan class="text">)</tspan> </text> </svg> </div> <p>It's an infix version of <a class="rsrv" href="../../../Ya/Morphisms/supertype">supertype</a> morphism.</p> <p>You cannot use this operator standalone, only in operator composites:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="expr" href="../../../Ya/Operators/ya'st">`ya'st`</a> <tspan class="text">:</tspan> <a class="expr">t</a> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/Arrow">`AR____`</a> <a class="expr">target</a> <tspan class="text">(</tspan> <a class="expr">source</a> <tspan class="text">(</tspan> <a class="type" href="../../../Ya/Glossary/Subtyping">Supertype</a> <a class="expr">o</a> <tspan class="text">)</tspan> <a class="expr">a</a> <tspan class="text">)</tspan> <tspan class="text">(</tspan> <a class="expr">t</a> <a class="expr">o</a> <tspan class="text">)</tspan> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="expr" href="../../../Ya/Operators/yo'st">`yo'st`</a> <tspan class="text">:</tspan> <a class="expr">t</a> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/Arrow">`AR____`</a> <a class="expr">target</a> <tspan class="text"

<!DOCTYPE html><html lang="en" class="h-full scroll-smooth antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- <BaseHead title={title}/> --><link rel="stylesheet" href="../../../assets/Me.qsPq6khh.css"></head> <body> <div class="main-container"> <div class="navigation"> <h1 class="brand"><a href="../../../">Murat Kasimov</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Me">More about me</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Ya">Я language (β)</a></h1> </div> <div class="content"> <!-- <Breadcrumbs /> --> <h1 class="text-xl font-bold" style="padding-bottom: 10px;"> /Я language (β)/Morphisms/that/ </h1>  <p><a href="../../../Ya/Primitives/Arrow">Arrow</a> morphism that gives you an access to a second item of a <a href="../../../Ya/Primitives/Product">Product</a>:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="text">></a> <a class="rsrv">that</a> <a class="text">:</a> <a class="expr">i</a> <a class="type" href="../../../Ya/Primitives/P">`P`</a> <a class="expr">ii</a> <a class="type" href="../../../Ya/Primitives/AR">`AR___`</a> <a class="expr">ii</a> </text> </svg> </div> <p>You can get the same morphism in <a href="../../../Ya/Primitives/Scope">Scope</a> category:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="text">></a> <a class="type" href="../../../Ya/Primitives/Scope">Scope</a> <a class="expr" href="../../../Ya/Operators/har">`har`</a> <a class="rsrv" href="../../../Ya/Morphisms/record">record</a> <a class="type">@ii</a> <a class="text">:</a> <a class="expr">i</a> <a class="type" href="../../../Ya/Primitives/P">`P`</a> <a class="expr">ii</a> <a class="type" href="../../../Ya/Primitives/Scope">`AT___`</a> <a class="expr">ii</a> </text> </svg> </div> <p>Morphism that takes a first element is called <a href="../../../Ya/Morphisms/this">this</a>.</p>  </div> </div>  </body></html>

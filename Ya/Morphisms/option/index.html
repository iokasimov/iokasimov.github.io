<!DOCTYPE html><html lang="en" class="h-full scroll-smooth antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- <BaseHead title={title}/> --><link rel="stylesheet" href="../../../assets/Me.DF2Qdb4k.css"></head> <body> <div class="main-container"> <div class="navigation"> <h1 class="brand"><a href="../../../">Murat Kasimov</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Me">More about me</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Ya">Я language (β)</a></h1> </div> <div class="content"> <!-- <Breadcrumbs /> --> <h1 class="text-xl font-bold" style="padding-bottom: 10px;"> /Я language (β)/Morphisms/option/ </h1>  <p>Based on provided type this <a class="type" href="../../../Ya/Primitives/Arrow">Arrow</a> morphism will try to give you an access to an item within some <a class="type" href="../../../Ya/Primitives/Among">Sum</a>.</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="../../../Ya/Morphisms/option">option</a> <a class="type">@ii</a> <tspan class="text">:</tspan> <tspan class="expr">i</tspan> <a class="type" href="../../../Ya/Primitives/Arrow">`AR____`</a> <tspan class="expr">i</tspan> <a class="type" href="../../../Ya/Primitives/M">`M`</a> <tspan class="expr">ii</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">ii</tspan> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="../../../Ya/Morphisms/option">option</a> <a class="type">@i</a> <tspan class="text">:</tspan> <tspan class="expr">i</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">ii</tspan> <a class="type" href="../../../Ya/Primitives/Arrow">`AR___`</a> <tspan class="expr">ii</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">i</tspan> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="../../../Ya/Morphisms/option">option</a> <a class="type">@ii</a> <tspan class="text">:</tspan> <tspan class="expr">i</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">ii</tspan> <a class="type" href="../../../Ya/Primitives/Arrow">`AR___`</a> <tspan class="expr">i</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">ii</tspan> </text> </svg> </div> <p>Since <a class="type" href="../../../Ya/Primitives/Among">sums</a> could be inductively defined, it's also possible to get an access to deeply nested items:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="../../../Ya/Morphisms/option">option</a> <a class="type">@i</a> <tspan class="text">:</tspan> <tspan class="expr">i</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">ii</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">iii</tspan> <a class="type" href="../../../Ya/Primitives/Arrow">`AR___`</a> <tspan class="expr">ii</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">iii</tspan> <a class="type" href="../../../Ya/Primitives/Among">`S`</a> <tspan class="expr">i</tspan> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="../../../Ya/Morphisms/option">option</a> <a c

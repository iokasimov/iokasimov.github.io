<!DOCTYPE html><html lang="en" class="h-full scroll-smooth antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- <BaseHead title={title}/> --><link rel="stylesheet" href="../../../_astro/Me.qsPq6khh.css"></head> <body> <div class="main-container"> <div class="navigation"> <h1 class="brand"><a href="../../../">Murat Kasimov</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Me">More about me</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Ya">Я language (β)</a></h1> </div> <div class="content"> <!-- <Breadcrumbs /> --> <h1 class="text-xl font-bold" style="padding-bottom: 10px;"> /Я language (β)/Morphisms/basetype/ </h1>  <p><a class="type" href="../../../Ya/Primitives/Arrow">Arrow</a> and <a class="type" href="../../../Ya/Primitives/Scope">Scope</a> morphism from an object to its <a class="type" href="../../../Ya/Glossary/Subtyping">Basetype</a>:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="text">></a> <a class="rsrv">basetype</a> <a class="text">:</a> <a class="expr">i</a> <a class="type" href="../../../Ya/Primitives/AR">`AR___`</a> <a class="type" href="../../../Ya/Glossary/Subtyping">Basetype</a> <a class="expr">i</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="text">></a> <a class="rsrv">basetype</a> <a class="text">:</a> <a class="expr">i</a> <a class="type" href="../../../Ya/Primitives/AT">`AT___`</a> <a class="type" href="../../../Ya/Glossary/Subtyping">Basetype</a> <a class="expr">i</a> </text> </svg> </div> <p>You can use this morphism in <a href="../../../Ya/Operators/bt">operator composites</a>.</p> <p>Inverse of this morphism is called <a href="../../../Ya/Morphisms/boundtype">boundtype</a>.</p>  </div> </div>  </body></html>

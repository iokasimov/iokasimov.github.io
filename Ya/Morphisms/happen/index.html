<!DOCTYPE html><html lang="en" class="h-full scroll-smooth antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- <BaseHead title={title}/> --><link rel="stylesheet" href="../../../_astro/Me.qsPq6khh.css"></head> <body> <div class="main-container"> <div class="navigation"> <h1 class="brand"><a href="../../../">Murat Kasimov</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Me">More about me</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Ya">Я language (β)</a></h1> </div> <div class="content"> <!-- <Breadcrumbs /> --> <h1 class="text-xl font-bold" style="padding-bottom: 10px;"> /Я language (β)/Morphisms/happen/ </h1>  <p><a href="../../../Ya/Glossary/Natural-Transformation">Component</a> of some <a href="../../../Ya/Glossary/Natural-Transformation">(un)natural transfromation</a> in <a href="../../../Ya/Primitives/Event">Event</a> <a href="../../../Ya/Glossary/Category">semicategory</a>:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="text">></a> <a class="type" href="../../../Ya/Primitives/Event">Event</a> <a class="expr" href="../../../Ya/Operators/har">`har`</a> <a class="rsrv" href="../../../Ya/Morphisms/happen">happen</a> <a class="text">@</a> <a class="expr">tt</a> <a class="text">@</a> <a class="expr">t</a> <a class="text">:</a> <a class="expr">t</a> <a class="type" href="../../../Ya/Glossary/Labeling">`L`</a> <a class="text">_</a> <a class="type" href="../../../Ya/Primitives/T">`T`</a> <a class="text">_</a> <a class="type" href="../../../Ya/Primitives/C'TR">`C'TR__`</a> <a class="expr">tt</a> </text> </svg> </div> <p>To run it you need to provide <a href="../../../Ya/Glossary/Labeling">labels</a>, for example: <a href="../../../Ya/Behaviour/Adapt">Adapt</a>.</p> <p>For <a href="../../../Ya/Glossary/Natural-Transformation">components</a> in <a href="../../../Ya/Primitives/

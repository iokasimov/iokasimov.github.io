ossary/Labeling">`L`</a> <a class="type" href="../../../Ya/Packages/World">World</a> <a class="type" href="../../../Ya/Primitives/T">`T`</a> <a class="text">_</a> <a class="type" href="../../../Ya/Primitives/T">`T`</a> <a class="expr">i</a> </text> </svg> </div> <p>For asynchronous behaviour check out <a href="../../../Ya/Packages/World.Async">World.Async</a> package.</p> <p><a href="http://github.com/iokasimov/ya-world">Source code is availabe at Github.</a></p>  </div> </div>  </body></html>

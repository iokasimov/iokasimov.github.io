<!DOCTYPE html><html lang="en" class="h-full scroll-smooth antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- <BaseHead title={title}/> --><link rel="stylesheet" href="../../../assets/Me.DF2Qdb4k.css"></head> <body> <div class="main-container"> <div class="navigation"> <h1 class="brand"><a href="../../../">Murat Kasimov</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Me">More about me</a></h1> <h1 class="text-2lg font-bold"><a href="../../../Ya">Я language (β)</a></h1> </div> <div class="content"> <!-- <Breadcrumbs /> --> <h1 class="text-xl font-bold" style="padding-bottom: 10px;"> /Я language (β)/Primitives/AT/ </h1>  <p>Infix version of <a href="../../../Ya/Primitives/Scope">Scope</a>:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">AT</a> <a class="text">-</a> <a class="type" href="../../../Ya/Primitives/Scope">[AT]tribute</a> <p>Available infix type operators:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT`</a> <a class="expr">o</a> <a class="text">| precedence = 8</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT_`</a> <a class="expr">o</a> <a class="text">| precedence = 7</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT__`</a> <a class="expr">o</a> <a class="text">| precedence = 6</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT___`</a> <a class="expr">o</a> <a class="text">| precedence = 5</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT____`</a> <a class="expr">o</a> <a class="text">| precedence = 4</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT_____`</a> <a class="expr">o</a> <a class="text">| precedence = 3</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT______`</a> <a class="expr">o</a> <a class="text">| precedence = 2</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">:</tspan> <a class="expr">a</a> <a class="type" href="../../../Ya/Primitives/AT">`AT_______`</a> <a class="expr">o</a> <a class="text">| precedence = 1</a> </text> </svg> </div> </text> </svg> </div> </div> </div>  </body></html>

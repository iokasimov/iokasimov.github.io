<!DOCTYPE html><html lang="en" class="h-full scroll-smooth antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- <BaseHead title={title}/> --><link rel="stylesheet" href="/_astro/Me.DF2Qdb4k.css"></head> <body> <div class="main-container"> <div class="navigation"> <h1 class="brand"><a href="/">Murat Kasimov</a></h1> <h1 class="text-2lg font-bold"><a href="/Me">More about me</a></h1> <h1 class="text-2lg font-bold"><a href="/Ya">Я language (β)</a></h1> </div> <div class="content"> <!-- <Breadcrumbs /> --> <h1 class="text-xl font-bold" style="padding-bottom: 10px;"> /Я language (β)/Behaviour/Stump/ </h1>  <p>This is a label for <a href="/Ya/Glossary/Natural-Transformation">transforming</a> <a href="/Ya/Primitives/Stops">Stops</a> <b>into</b> <a href="/Ya/Primitives/Maybe">Maybe</a>, i.e. replace information about <a href="/Ya/Primitives/Stops">Error</a> with <a href="/Ya/Primitives/Unit">Unit</a>.</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="/Ya/Morphisms/derive">derive</a> <a class="expr" href="/Ya/Operators/ha">`ha`</a> <a class="type" href="/Ya/Behaviour/Stump">Stump</a> <a class="expr" href="/Ya/Operators/ha">`ha`</a> <a class="type" href="/Ya/Primitives/Stops">Valid</a> <a class="expr" href="/Ya/Operators/ha'nt'ha'st">`ha'nt'ha'st`</a> <a class="type" href="/Ya/Packages/ASCII">A</a> <a class="text">=</a> <a class="type" href="/Ya/Primitives/Maybe">Exist</a> <a class="expr" href="/Ya/Operators/ha'nt'ha'st">`ha'nt'ha'st`</a> <a class="type" href="/Ya/Packages/ASCII">A</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="rsrv" href="/Ya/Morphisms/derive">derive</a> <a class="expr" href="/Ya/Operators/ha">`ha`</a> <a class="type" href="/Ya/Behaviour/Stump">Stump</a> <a class="expr" href="/Ya/Operators/ha">`ha`</a> <a class="type" href="/Ya/Primitives/Stops">Error</a> <a class="expr" href="/Ya/Operators/ha'nt'ha'st">`ha'nt'ha'st`</a> <a class="type" href="/Ya/Packages/ASCII">B</a> <a class="text">=</a> <a class="type" href="/Ya/Primitives/Maybe">Empty</a> <a class="expr" href="/Ya/Operators/ha'nt'ha">`ha'nt'ha`</a> <a class="type" href="/Ya/Primitives/Unit">Unit</a> </text> </svg> </div> <p>This is how you would do the same thing manually:</p> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="type" href="/Ya/Primitives/Stops">Error</a> <a class="expr" href="/Ya/Operators/ho'ut'st">`ho'ut'st`</a> <a class="type" href="/Ya/Primitives/Maybe">Empty</a> <a class="expr" href="/Ya/Operators/ha'dc'ha'nt'ha">`ha'dc'ha'nt'ha`</a> <a class="type" href="/Ya/Primitives/Maybe">Exist</a> <a class="expr" href="/Ya/Operators/ha'nt'ha">`hc__`</a> <a class="type" href="/Ya/Primitives/Stops">Valid</a> <a class="expr" href="/Ya/Operators/ha'nt'ha'st">`ha'nt'ha'st`</a> <a class="type" href="/Ya/Packages/ASCII">A</a> <a class="text">=</a> <a class="type" href="/Ya/Primitives/Exist">Exist</a> <a class="expr" href="/Ya/Operators/ha'nt'ha'st">`ha'nt'ha'st`</a> <a class="type" href="/Ya/Packages/ASCII">A</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <tspan class="text">></tspan> <a class="type" href="/Ya/Primitives/Stops">Error</a> <a class="expr" href="/Ya/Operators/ho'ut'st">`ho'ut'st`</a> <a class="type" href="/Ya/Primitives/Maybe">Empty</a> <a class="expr" href="/Ya/Operators/ha'dc'ha'nt'ha">`ha'dc'ha'nt'ha`</a> <a class="type" href="/Ya/Primitives/Maybe">Exist</a> <a class="expr" href="/Ya/Operators/ha'nt'ha">`hc__`</a>

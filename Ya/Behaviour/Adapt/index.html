ar">`har`</a> <a class="rsrv" href="../../../Ya/Morphisms/derive">derive</a> <a class="expr" href="../../../Ya/Operators/ha">`ha`</a> <a class="type" href="../../../Ya/Behaviour/Adapt">Adapt</a> <a class="text">:</a> <a class="type" href="../../../Ya/Primitives/Tree">Tree</a> <a class="type" href="../../../Ya/Primitives/C'AR">`C'AR__`</a> <a class="type" href="../../../Ya/Primitives/Scrolling-Tree">Scrolling Tree</a> </text> </svg> </div> <div> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="height: 25px; width: 2500px;"> <text x="0" y="15"> <a class="text">></a> <a class="type" href="../../../Ya/Primitives/Arrow">Arrow</a> <a class="expr" href="../../../Ya/Operators/har">`har`</a> <a class="rsrv" href="../../../Ya/Morphisms/derive">derive</a> <a class="expr" href="../../../Ya/Operators/ha">`ha`</a> <a class="type" href="../../../Ya/Behaviour/Adapt">Adapt</a> <a class="text">:</a> <a class="type" href="../../../Ya/Primitives/Scrolling-Tree">Scrolling Tree</a> <a class="type" href="../../../Ya/Primitives/C'AR">`C'AR__`</a> <a class="type" href="../../../Ya/Primitives/Tree">Tree</a> </text> </svg> </div> <p>The exact same label with functor switched is called <a href="../../../Ya/Behaviour/Apply">Apply</a>.</p> <br> <br> <br>  </div> </div>  </body></html>
